<!DOCTYPE html>
<html>
<head>
<title>IRO - Issues Reporting Outlet</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
header{background:#1f4e79;color:white;padding:20px;text-align:center}
.container{width:90%;max-width:600px;margin:25px auto;background:white;padding:20px;border-radius:10px}
label{display:block;margin-top:15px;font-weight:bold}
input,select,textarea{width:100%;padding:10px;margin-top:5px;box-sizing:border-box}
textarea{height:100px}
button{margin-top:20px;width:100%;padding:12px;background:#1f4e79;color:white;border:0;border-radius:5px}
</style>
</head>

<body>

<header>
<h1>IRO</h1>
<p>Issues Reporting Outlet</p>
</header>

<div class="container">
<h2>Report an Issue</h2>

<label>Name</label>
<input type="text" placeholder="Enter your name">

<label>Location</label>
<input type="text" placeholder="Enter location">

<label>Issue Category</label>
<select>
<option>Select an issue</option>
<option>Security</option>
<option>Road</option>
<option>Water</option>
<option>Electricity</option>
<option>Other</option>
</select>

<label>Describe the Issue</label>
<textarea placeholder="Describe the problem"></textarea>

<button>Submit Report</button>
</div>

</body>
</html>
